# Opt-in grant-based replay. Combine with the repository's local compose.yaml.
# Keep each hospital credential private and distinct; never give hospitals the
# operator/Cloud token or PostgreSQL credentials.
x-hospital-tokens: &hospital-tokens
  CONTROLLER_HOSPITAL_TOKENS: '{"Hospital_A":"${HOSPITAL_A_CONTROLLER_TOKEN:?Set a distinct 32+ character Hospital A token}","Hospital_B":"${HOSPITAL_B_CONTROLLER_TOKEN:?Set a distinct 32+ character Hospital B token}"}'

services:
  controller:
    environment:
      <<: *hospital-tokens
      CONTROLLER_ADMISSION_POLICY: ${CONTROLLER_ADMISSION_POLICY:-fixed}
      CONTROLLER_ADMISSION_ADDITIVE_RPS: ${CONTROLLER_ADMISSION_ADDITIVE_RPS:-0.2}
      CONTROLLER_ADMISSION_ENABLED: ${CONTROLLER_ADMISSION_ENABLED:-1}
      CONTROLLER_ADMISSION_NORMAL_RPS: ${CONTROLLER_ADMISSION_NORMAL_RPS:-2}
      CONTROLLER_ADMISSION_CAUTION_RPS: ${CONTROLLER_ADMISSION_CAUTION_RPS:-0.5}
      CONTROLLER_ADMISSION_RECOVERY_RPS: ${CONTROLLER_ADMISSION_RECOVERY_RPS:-0.2}
      CONTROLLER_ADMISSION_NORMAL_INFLIGHT: ${CONTROLLER_ADMISSION_NORMAL_INFLIGHT:-4}
      CONTROLLER_ADMISSION_CAUTION_INFLIGHT: ${CONTROLLER_ADMISSION_CAUTION_INFLIGHT:-2}
      CONTROLLER_ADMISSION_RECOVERY_INFLIGHT: ${CONTROLLER_ADMISSION_RECOVERY_INFLIGHT:-1}
      CONTROLLER_ADMISSION_POLL_SECONDS: ${CONTROLLER_ADMISSION_POLL_SECONDS:-5}
      CONTROLLER_ADMISSION_MAX_AGE_SECONDS: ${CONTROLLER_ADMISSION_MAX_AGE_SECONDS:-15}
      CONTROLLER_ADMISSION_TIMEOUT_SECONDS: ${CONTROLLER_ADMISSION_TIMEOUT_SECONDS:-2}
      CONTROLLER_ADMISSION_DWELL_SECONDS: ${CONTROLLER_ADMISSION_DWELL_SECONDS:-15}
      CONTROLLER_ADMISSION_HEALTHY_SAMPLES: ${CONTROLLER_ADMISSION_HEALTHY_SAMPLES:-3}
      CONTROLLER_ADMISSION_CAUTION_LATENCY_MS: ${CONTROLLER_ADMISSION_CAUTION_LATENCY_MS:-250}
      CONTROLLER_ADMISSION_RECOVERY_LATENCY_MS: ${CONTROLLER_ADMISSION_RECOVERY_LATENCY_MS:-1000}
      CONTROLLER_ADMISSION_HEALTHY_LATENCY_MS: ${CONTROLLER_ADMISSION_HEALTHY_LATENCY_MS:-150}
      CONTROLLER_ADMISSION_CAUTION_ERROR_RATE: ${CONTROLLER_ADMISSION_CAUTION_ERROR_RATE:-0.05}
      CONTROLLER_ADMISSION_RECOVERY_ERROR_RATE: ${CONTROLLER_ADMISSION_RECOVERY_ERROR_RATE:-0.2}
      CONTROLLER_ADMISSION_HEALTHY_ERROR_RATE: ${CONTROLLER_ADMISSION_HEALTHY_ERROR_RATE:-0.01}
      CONTROLLER_ADMISSION_CAUTION_THROUGHPUT_RPS: ${CONTROLLER_ADMISSION_CAUTION_THROUGHPUT_RPS:-20}
      CONTROLLER_ADMISSION_RECOVERY_THROUGHPUT_RPS: ${CONTROLLER_ADMISSION_RECOVERY_THROUGHPUT_RPS:-50}
      CONTROLLER_ADMISSION_HEALTHY_THROUGHPUT_RPS: ${CONTROLLER_ADMISSION_HEALTHY_THROUGHPUT_RPS:-10}
  patient:
    environment:
      <<: *hospital-tokens
      METAGUARD_REQUIRED: "1"
  emergency:
    environment:
      <<: *hospital-tokens
      METAGUARD_REQUIRED: "1"
  admin:
    environment:
      <<: *hospital-tokens
      METAGUARD_REQUIRED: "1"
  hospital-a:
    environment:
      METAGUARD_ENABLED: "1"
      CONTROLLER_URL: http://controller:8000
      HOSPITAL_CONTROLLER_TOKEN: ${HOSPITAL_A_CONTROLLER_TOKEN:?Set Hospital A token}
  hospital-b:
    environment:
      METAGUARD_ENABLED: "1"
      CONTROLLER_URL: http://controller:8000
      HOSPITAL_CONTROLLER_TOKEN: ${HOSPITAL_B_CONTROLLER_TOKEN:?Set Hospital B token}
  dashboard:
    environment:
      METAGUARD_REQUIRED: "1"
      DASHBOARD_CONTROLLER_URL: http://controller:8000
      DASHBOARD_CONTROLLER_TOKEN: ${CONTROLLER_CLOUD_TOKEN:?Set a private controller operator token}
